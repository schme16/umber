[package]
name = "umber"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "x11", "wayland", "default_fonts", "accesskit"] }
egui = "0.37"
env_logger = "0.11.11"
glam = { version = "0.30", features = ["bytemuck"] }
half = "2.7.1"
gltf = "1.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4.35"
rfd = "0.18.0"
tobj = "4"
x11rb = { version = "0.13", features = ["xinput"] }

[dev-dependencies]
pollster = "1.0.3"

# Dependencies (image decoding, wgpu, egui) run optimised even in debug builds, so opening a
# model with big textures doesn't take seconds while working on Umber itself.
[profile.dev.package."*"]
opt-level = 2
